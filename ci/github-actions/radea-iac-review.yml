# A separate trusted "Terraform Plan" workflow must upload plan.json as terraform-plan.
# This job never checks out PR source or executes Terraform providers.
name: RADEA · IaC Review
on:
  workflow_run:
    workflows: ["Terraform Plan"]
    types: [completed]
permissions:
  contents: read
jobs:
  iac-review:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Validate reviewed tool revision
        env:
          RADEA_REF: ${{ vars.RADEA_REF }}
        run: '[[ "$RADEA_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CloudOpsMaster/radea
          ref: ${{ vars.RADEA_REF }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies and reviewed tool
        run: |
          pip install --require-hashes -r requirements-ci.lock
          pip install --no-deps --no-build-isolation .
      - name: Review plan artifact and publish validated draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADEA_RUN_ID: ${{ github.event.workflow_run.id }}
          RADEA_WORKFLOW_MODE: iac-review
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADEA_MODEL: ${{ vars.RADEA_MODEL || 'openai/gpt-4o' }}
          RADEA_AUDIT_DIR: ${{ runner.temp }}/radea-audit
        run: python -m radea.integrations.github
