# Copy to .github/workflows/radea-debug.yml in a consumer repository.
# RADEA_REF must be a reviewed full commit SHA; inference credentials are explicit.
name: RADEA · Build Triage
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Validate reviewed tool revision
        env:
          RADEA_REF: ${{ vars.RADEA_REF }}
        run: '[[ "$RADEA_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: CloudOpsMaster/radea
          ref: ${{ vars.RADEA_REF }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies and reviewed tool
        run: |
          pip install --require-hashes -r requirements-ci.lock
          pip install --no-deps --no-build-isolation .
      - name: Analyze failed job text logs and publish validated draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADEA_RUN_ID: ${{ github.event.workflow_run.id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADEA_MODEL: ${{ vars.RADEA_MODEL || 'openai/gpt-4o' }}
          RADEA_AUDIT_DIR: ${{ runner.temp }}/radea-audit
        run: python -m radea.integrations.github
