# Explicit manual inference only. Never runs on PRs or untrusted input.
name: Live provider smoke
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Explicit provider/model selection; one synthetic inference request"
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes -r requirements-ci.lock
          pip install --require-hashes -r requirements-providers.lock
          pip install --no-deps --no-build-isolation .
      - name: One synthetic request through guarded runtime
        env:
          RADEA_MODEL: ${{ inputs.model }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          RADEA_AUDIT_DIR: ${{ runner.temp }}/radea-live-audit
        run: radea smoke --live --output json > live-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-provider-smoke
          path: live-smoke.json
          if-no-files-found: ignore
