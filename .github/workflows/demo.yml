name: RADEA Demo

on:
  workflow_dispatch:
    inputs:
      command:
        description: Demo track
        required: true
        default: full
        type: choice
        options:
          - full
          - debug
          - iac-review
          - triage
          - delivery
          - platform
          - governance
          - migration

permissions:
  contents: read

jobs:
  demo:
    name: Run offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install RADEA and locked dependencies
        run: |
          pip install --require-hashes -r requirements-ci.lock
          pip install --no-deps --no-build-isolation .
      - name: Run the selected scenarios
        env:
          DEMO_TRACK: ${{ inputs.command }}
        run: python tools/run_demo.py --track "$DEMO_TRACK" --output-dir demo-output
      - name: Write run summary
        if: always()
        shell: bash
        run: |
          if [[ -f demo-output/SUMMARY.md ]]; then
            cat demo-output/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload demo evidence
        if: ${{ always() && hashFiles('demo-output/SUMMARY.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radea-demo-${{ inputs.command }}
          path: |
            demo-output/SUMMARY.md
            demo-output/commands.txt
            demo-output/inputs/
            demo-output/reports/
          if-no-files-found: error
          retention-days: 14
