name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked dependencies and project
        run: |
          pip install --require-hashes -r requirements-ci.lock
          pip install --no-deps --no-build-isolation -e .
      - run: ruff check src/ tests/ tools/
      - run: mypy src/
      - run: pytest tests/ --no-cov -v
      - name: Review our own workflows with RADEA
        run: radea ci-review .github/workflows --fail-on medium
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-ci.lock
      - name: Review complete dependency graph across interpreter markers
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180
      - name: Audit locked dependency set
        run: pip-audit --strict --no-deps --disable-pip --require-hashes -r requirements-ci.lock
      - name: Audit optional provider SDKs
        run: pip-audit --strict --disable-pip --require-hashes -r requirements-providers.lock
      - run: bandit -r src/ -ll
  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-ci.lock
      - name: Constrained CPU and memory acceptance
        run: |
          mkdir -p dist
          PYTHONPATH=src python tools/benchmark_runner.py --output dist/runner-benchmark.json
          PYTHONPATH=src python tools/benchmark_runner.py --model offline-linear --output dist/linear-benchmark.json
          PYTHONPATH=src python tools/benchmark_runner.py --model offline-neural --output dist/neural-benchmark.json
          PYTHONPATH=src python tools/compare_offline_models.py --output dist/offline-comparison.json
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*.whl dist/*.tar.gz
      - name: Runtime dependency SBOM and checksums
        run: |
          pip-audit --strict --no-deps --disable-pip --require-hashes -r requirements-runtime.lock -f cyclonedx-json -o dist/runtime-dependencies.cdx.json
          cd dist
          sha256sum *.whl *.tar.gz runtime-dependencies.cdx.json *benchmark.json offline-comparison.json > SHA256SUMS
      - name: Smoke test the built wheel outside source
        env:
          RADEA_AUDIT_DIR: ${{ runner.temp }}/radea-smoke-audit
        run: |
          python -m venv /tmp/radea-smoke
          /tmp/radea-smoke/bin/pip install --require-hashes -r requirements-runtime.lock
          /tmp/radea-smoke/bin/pip install --no-deps dist/*.whl
          export RADEA_EXAMPLES="$GITHUB_WORKSPACE/examples"
          cd /tmp
          /tmp/radea-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('openai') is None"
          /tmp/radea-smoke/bin/radea --version
          /tmp/radea-smoke/bin/radea debug --log "$RADEA_EXAMPLES/logs/failed-build.log"
          /tmp/radea-smoke/bin/radea iac-review --file "$RADEA_EXAMPLES/terraform/main.tf"
          /tmp/radea-smoke/bin/radea triage --logs "$RADEA_EXAMPLES/logs/incident.log"
          /tmp/radea-smoke/bin/radea k8s-review "$RADEA_EXAMPLES/k8s/good.yaml"
          /tmp/radea-smoke/bin/radea dockerfile-review "$RADEA_EXAMPLES/docker/Dockerfile.good"
          /tmp/radea-smoke/bin/radea ci-review "$RADEA_EXAMPLES/ci/github-good.yml"
          /tmp/radea-smoke/bin/radea tf-review "$RADEA_EXAMPLES/terraform/hardened.tf"
          /tmp/radea-smoke/bin/radea rules --prefix K8S > /dev/null
          work="$(mktemp -d)"
          service="$work/service"
          /tmp/radea-smoke/bin/radea service-scaffold "$service" --name service --owner platform \
            --base-image "docker.io/library/python@sha256:$(printf '%064d' 0)"
          /tmp/radea-smoke/bin/python -c 'import sys,yaml; assert yaml.safe_load(open(sys.argv[1]))["spec"]["owner"] == "platform"' \
            "$service/catalog-info.yaml"
          /tmp/radea-smoke/bin/radea code-review "$service"
          /tmp/radea-smoke/bin/radea ci-review "$service/.github/workflows/ci.yml" --fail-on low
          /tmp/radea-smoke/bin/radea dockerfile-review "$service/Dockerfile" --fail-on low
          printf '%s\n' '{"repository":"api","provides":{"service/http":"v1"}}' > "$work/provider.json"
          printf '%s\n' '{"repository":"client","requires":{"service/http":"v1"}}' |
            /tmp/radea-smoke/bin/radea repo-contract-check "$work/provider.json" - --fail-on-change
          printf '%s\n' '{"experiment":"checkout","observations":[{"cohort":"a","variant":"control","success":false},{"cohort":"b","variant":"new","success":true}]}' |
            /tmp/radea-smoke/bin/radea flag-experiment - --control control > "$work/experiment.json"
          /tmp/radea-smoke/bin/python -c 'import json,sys; assert json.load(open(sys.argv[1]))["variants"][1]["delta_percentage_points"] == 100' \
            "$work/experiment.json"
          cd "$service"
          /tmp/radea-smoke/bin/python -B -m unittest -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radea-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
