name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked dependencies and project
        run: |
          pip install --require-hashes -r requirements-ci.lock
          pip install --no-deps --no-build-isolation -e .
      - run: ruff check src/ tests/
      - run: pytest tests/ --no-cov -v
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-ci.lock
      - name: Audit locked dependency set
        run: pip-audit --strict --no-deps --disable-pip --require-hashes -r requirements-ci.lock
      - run: bandit -r src/ -ll
  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-ci.lock
      - run: python -m build --no-isolation
      - run: twine check --strict dist/*
      - name: Runtime dependency SBOM and checksums
        run: |
          pip-audit --strict --no-deps --disable-pip --require-hashes -r requirements-runtime.lock -f cyclonedx-json -o dist/runtime-dependencies.cdx.json
          cd dist
          sha256sum *.whl *.tar.gz runtime-dependencies.cdx.json > SHA256SUMS
      - name: Smoke test the built wheel outside source
        env:
          RADEA_AUDIT_DIR: ${{ runner.temp }}/radea-smoke-audit
        run: |
          python -m venv /tmp/radea-smoke
          /tmp/radea-smoke/bin/pip install --require-hashes -r requirements-runtime.lock
          /tmp/radea-smoke/bin/pip install --no-deps dist/*.whl
          export RADEA_EXAMPLES="$GITHUB_WORKSPACE/examples"
          cd /tmp
          /tmp/radea-smoke/bin/radea --version
          /tmp/radea-smoke/bin/radea debug --log "$RADEA_EXAMPLES/logs/failed-build.log" --dry-run
          /tmp/radea-smoke/bin/radea iac-review --file "$RADEA_EXAMPLES/terraform/main.tf" --dry-run
          /tmp/radea-smoke/bin/radea triage --logs "$RADEA_EXAMPLES/logs/incident.log" --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: radea-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
