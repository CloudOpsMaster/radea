name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/ --no-cov -v

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit bandit
      - name: Audit installed dependencies
        run: |
          pip list --format=freeze --exclude radea > /tmp/radea-dependencies.txt
          pip-audit --strict --no-deps --disable-pip -r /tmp/radea-dependencies.txt
      - name: Static security analysis
        run: bandit -r src/ -ll

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke test installed wheel outside the source tree
        run: |
          python -m venv /tmp/radea-smoke
          /tmp/radea-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/radea-smoke/bin/radea --version
          /tmp/radea-smoke/bin/radea --help
