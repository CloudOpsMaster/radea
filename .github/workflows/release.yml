name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: radea-distributions
          path: dist
      - name: Verify tested artifact checksums and version tag
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          python - <<'PYCODE'
          import glob, os, re, zipfile
          from email.parser import BytesParser
          wheels = glob.glob('*.whl')
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as wheel:
              name = next(n for n in wheel.namelist() if n.endswith('.dist-info/METADATA'))
              version = BytesParser().parsebytes(wheel.read(name))['Version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match package version'
          prerelease = bool(re.search(r'(?:a|b|rc)\d+|\.dev\d+', version))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('prerelease=' + str(prerelease).lower(), file=output)
          PYCODE
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ steps.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.metadata.outputs.prerelease == 'false' && 'true' || 'false' }}
