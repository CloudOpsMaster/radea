[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radea"
version = "0.1.0"
description = "Reliable AI-Driven Engineering Automation — opinionated AI CLI for DevOps with guardrails"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RADEA Contributors" }]

dependencies = [
    "click>=8.1.7",
    "openai>=1.35.0",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
google    = ["google-generativeai>=0.8.0"]
all       = ["anthropic>=0.34.0", "google-generativeai>=0.8.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/CloudOpsMaster/radea"
Repository = "https://github.com/CloudOpsMaster/radea"
Issues = "https://github.com/CloudOpsMaster/radea/issues"

[project.scripts]
radea = "radea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --no-cov"
