[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radea"
version = "0.3.0rc2"
description = "Reliable AI-Driven Engineering Automation — opinionated AI CLI for DevOps with guardrails"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RADEA Contributors" }]

dependencies = [
    "click>=8.1.7",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
openai = ["openai>=1.35.0"]
ollama = ["openai>=1.35.0"]
anthropic = ["anthropic>=0.34.0"]
google    = ["google-genai>=1.0"]
all       = ["openai>=1.35.0", "anthropic>=0.34.0", "google-genai>=1.0"]
dev = [
    "openai>=1.35.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/CloudOpsMaster/radea"
Repository = "https://github.com/CloudOpsMaster/radea"
Issues = "https://github.com/CloudOpsMaster/radea/issues"

[project.scripts]
radea = "radea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Provider SDKs are optional extras and are not installed in every environment.
module = ["openai.*", "anthropic.*", "google.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --no-cov"

[dependency-groups]
tooling = ["build", "twine", "pip-audit; python_version >= '3.11'", "bandit", "setuptools>=77", "wheel", "pyyaml", "pip"]

[tool.uv]
constraint-dependencies = ["filelock>=4.2.1"]

[tool.setuptools.package-data]
radea = ["data/*.json", "data/golden/*.tmpl"]
