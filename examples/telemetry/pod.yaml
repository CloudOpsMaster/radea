apiVersion: v1
kind: Pod
metadata:
  name: radea-telemetry
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: collector
      image: docker.io/otel/opentelemetry-collector@sha256:5fdfd70f8e54b0dfb1ce3f403978a56054aba49a2922b6b118bb30d301812cde
      args: ["--config=/collector/config.yaml"]
      resources:
        requests: {cpu: 50m, memory: 48Mi}
        limits: {cpu: 300m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: collector-config
          mountPath: /collector
          readOnly: true
    - name: capture
      image: docker.io/library/radea-telemetry:lab
      imagePullPolicy: Never
      args: ["telemetry-capture", "/captures/session", "--port", "14318"]
      resources:
        requests: {cpu: 25m, memory: 48Mi}
        limits: {cpu: 300m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: captures
          mountPath: /captures
  volumes:
    - name: collector-config
      configMap:
        name: radea-collector
    - name: captures
      emptyDir:
        sizeLimit: 32Mi
