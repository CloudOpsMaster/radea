receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

exporters:
  otlphttp/radea:
    endpoint: http://127.0.0.1:14318
    compression: none
    encoding: json
    timeout: 5s

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/radea]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/radea]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/radea]
