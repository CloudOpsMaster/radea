apiVersion: v1
kind: ServiceAccount
metadata:
  name: radea-message-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radea-message-controller
rules:
  - apiGroups: ["lab.radea.dev"]
    resources: ["messages"]
    verbs: ["get", "list"]
  - apiGroups: ["lab.radea.dev"]
    resources: ["messages/status"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radea-message-controller
subjects:
  - kind: ServiceAccount
    name: radea-message-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radea-message-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radea-message-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: radea-message-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radea-message-controller
    spec:
      serviceAccountName: radea-message-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: docker.io/library/radea-message-controller:lab
          imagePullPolicy: Never
          args: ["--namespace", "$(POD_NAMESPACE)"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 16Mi
